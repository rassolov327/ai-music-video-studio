<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="panelLoginScreen" class="home-screen">
  <div class="np-box">
    <div class="np-header">
      <h2>Sign in</h2>
    </div>
    <div class="cf-field">
      <label>Login</label>
      <input type="text" id="panelLoginInput" autocomplete="username">
    </div>
    <div class="cf-field">
      <label>Password</label>
      <input type="text" id="panelPasswordInput" autocomplete="current-password">
    </div>
    <div class="gen-hint" id="panelLoginErrorHint" style="color:var(--danger);display:none;"></div>
    <div class="cf-actions">
      <button class="cf-btn primary" id="panelLoginSubmitBtn" style="width:100%;">Sign in</button>
    </div>
  </div>
</div>

<div id="adminEditModal" class="task-preview-modal hidden">
  <div class="np-box" style="max-width:420px;">
    <div class="np-header">
      <h2>Edit user</h2>
      <button class="np-close" id="adminEditCloseBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    </div>
    <div class="cf-field"><label>Login</label><input type="text" id="adminEditLogin"></div>
    <div class="cf-field"><label>New password (leave blank to keep the current one)</label><input type="text" id="adminEditPassword"></div>
    <div class="cf-field">
      <label>Tokens: <span id="adminEditTokensCurrent">0</span></label>
      <div style="display:flex;gap:8px;" id="adminEditAddTokensRow">
        <input type="number" id="adminEditAddTokens" placeholder="Amount to add">
        <button class="cf-btn" id="adminEditAddTokensBtn">Add</button>
      </div>
      <div class="gen-hint" id="adminEditTokensLockedNote" style="display:none;">Always mirrors your real KIE balance — changes only from generations or topping up on KIE.</div>
    </div>
    <div class="gen-hint" id="adminEditErrorHint" style="color:var(--danger);display:none;"></div>
    <div class="cf-actions">
      <button class="cf-btn" id="adminEditCancelBtn">Cancel</button>
      <button class="cf-btn primary" id="adminEditSaveBtn">Save changes</button>
    </div>
  </div>
</div>

<div id="adminScreen" class="home-screen hidden">
  <div class="np-box" style="max-width:820px;">
    <div class="np-header">
      <h2>Admin — Users</h2>
      <button class="np-close" id="adminLogoutBtn" title="Log out"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    </div>

    <div id="adminAddUserForm" style="display:none;margin-bottom:14px;padding:12px;border:1px solid var(--line);border-radius:8px;">
      <div class="cf-field"><label>Name</label><input type="text" id="adminNewName"></div>
      <div class="cf-field"><label>Login</label><input type="text" id="adminNewLogin"></div>
      <div class="cf-field"><label>Password</label><input type="text" id="adminNewPassword"></div>
      <div class="cf-field"><label>Tokens</label><input type="number" id="adminNewTokens" value="0" min="0"></div>
      <div class="gen-hint" id="adminAddErrorHint" style="color:var(--danger);display:none;"></div>
      <div class="cf-actions">
        <button class="cf-btn" id="adminAddCancelBtn">Cancel</button>
        <button class="cf-btn primary" id="adminAddSaveBtn">Add user</button>
      </div>
    </div>

    <div class="cf-actions" style="margin-bottom:10px;">
      <button class="cf-btn primary" id="adminAddUserBtn">+ Add user</button>
    </div>

    <table class="admin-users-table">
      <thead>
        <tr><th>#</th><th>Name</th><th>Login</th><th>Tokens</th><th>Last login</th><th></th></tr>
      </thead>
      <tbody id="adminUsersBody"></tbody>
    </table>
  </div>
</div>

<div id="panelAccessDenied" class="home-screen hidden">
  <div class="np-box">
    <div class="np-header"><h2>Access denied</h2></div>
    <p class="sub">This account does not have admin access.</p>
  </div>
</div>

<script src="js/admin.js"></script>
<script>
(async function(){
  function show(id){ ['panelLoginScreen','adminScreen','panelAccessDenied'].forEach(x=>{
    document.getElementById(x).classList.toggle('hidden', x!==id);
  }); }

  async function tryEnterPanel(){
    let res;
    try{ res = await fetch('/api/me'); } catch(err){ show('panelLoginScreen'); return; }
    if(!res.ok){ show('panelLoginScreen'); return; }
    const me = await res.json();
    if(!me.isAdmin){ show('panelAccessDenied'); return; }
    show('adminScreen');
    wireAdminScreen();
  }

  document.getElementById('panelLoginSubmitBtn').onclick = async ()=>{
    const errHint = document.getElementById('panelLoginErrorHint');
    errHint.style.display = 'none';
    const login = document.getElementById('panelLoginInput').value.trim();
    const password = document.getElementById('panelPasswordInput').value;
    if(!login || !password) return;
    try{
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password }),
      });
      const data = await res.json().catch(()=> null);
      if(!res.ok){
        errHint.textContent = (data && data.message) || 'Could not sign in.';
        errHint.style.display = '';
        return;
      }
      tryEnterPanel();
    } catch(err){
      errHint.textContent = 'Could not reach the server.';
      errHint.style.display = '';
    }
  };
  document.getElementById('panelPasswordInput').addEventListener('keydown', (e)=>{
    if(e.key==='Enter') document.getElementById('panelLoginSubmitBtn').click();
  });
  document.getElementById('adminLogoutBtn').onclick = async ()=>{
    try{ await fetch('/api/logout', { method: 'POST' }); } catch(err){}
    location.reload();
  };

  tryEnterPanel();
})();
</script>
</body>
</html>
