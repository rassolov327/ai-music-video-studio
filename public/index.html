<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фабрика романов</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Фабрика романов — монитор</h1>
    <div id="dryRunBanner" class="banner hidden"></div>
    <p id="creditsLine" class="muted">Баланс kie.ai: —</p>
  </header>

  <section id="emptySection" class="hidden">
    <p class="muted">Активной книги нет. Задачи ставятся через чат с Клодом — эта страница только показывает ход работы.</p>
  </section>

  <section id="statusSection" class="hidden">
    <h2 id="statusTitle">—</h2>
    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <p id="phaseLabel">—</p>
    <p id="chapterProgress" class="muted"></p>
    <div id="confirmBox" class="hidden confirm-box">
      <p><strong>Требуется подтверждение траты кредитов kie.ai.</strong></p>
      <p id="costEstimateText" class="muted"></p>
      <button id="confirmBtn" type="button">Подтвердить и запустить</button>
      <button id="cancelBtn" type="button" class="secondary">Отменить</button>
    </div>
    <div id="downloadBox" class="hidden">
      <a id="downloadLink" href="#" class="button">Скачать PDF</a>
    </div>
    <div id="batchesBox" class="hidden">
      <h3>Готовые блоки</h3>
      <ul id="batchesList"></ul>
    </div>
    <p id="errorBox" class="error hidden"></p>
    <button id="retryBtn" type="button" class="hidden">Повторить</button>
    <h3>Логи</h3>
    <pre id="logPanel"></pre>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
